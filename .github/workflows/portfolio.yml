name: Portfolio Analyzer
on:
    # schedule:                          # ← comment these out
  #   - cron: '30 13 * * 1-5'
  #   - cron: '0 20 * * 1-5'
  workflow_dispatch:
    inputs:
      device_approval:
        description: "Robinhood device approval: watch the live log and tap Approve in the Robinhood app when it says 'Check robinhood app'"
        type: boolean
        default: false
      include_tax:
        description: "Include the Tax-Aware Trim Guidance section (fetches full order history; off by default)"
        type: boolean
        default: false
      analyze_misses:
        description: "Embed a Claude AI post-mortem of the Missed Opportunities (uses ANTHROPIC_API_KEY; off by default)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # cron-job.org fires this workflow every 20 min on weekdays, but it has no way
  # to skip US market holidays. This gate handles that: on an NYSE full-day
  # holiday it reports the market closed and analyze/deploy skip cleanly (green,
  # no Robinhood login, no API spend). Weekends are already excluded upstream by
  # the cron-job.org schedule. Pure stdlib — no checkout or pip install needed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - name: Is the US equity market open today?
        id: check
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("America/New_York")).date()
          y = today.year

          def easter(y):                # Anonymous Gregorian computus
              a=y%19; b=y//100; c=y%100; d=b//4; e=b%4
              f=(b+8)//25; g=(b-f+1)//3
              h=(19*a+b-d-g+15)%30; i=c//4; k=c%4
              l=(32+2*e+2*i-h-k)%7; m=(a+11*h+22*l)//451
              mo=(h+l-7*m+114)//31; da=((h+l-7*m+114)%31)+1
              return dt.date(y,mo,da)

          def nth(mo,wd,n):             # n-th weekday (Mon=0) of the month
              first=dt.date(y,mo,1)
              return first+dt.timedelta(days=(wd-first.weekday())%7+(n-1)*7)

          def last_mon(mo):             # last Monday of the month
              nxt=dt.date(y+(mo==12),(mo%12)+1,1)-dt.timedelta(days=1)
              return nxt-dt.timedelta(days=nxt.weekday()%7)

          def obs(d):                   # Sat->Fri, Sun->Mon NYSE observance
              if d.weekday()==5: return d-dt.timedelta(days=1)
              if d.weekday()==6: return d+dt.timedelta(days=1)
              return d

          hols={
              nth(1,0,3),               # MLK Jr. — 3rd Mon Jan
              nth(2,0,3),               # Presidents' — 3rd Mon Feb
              easter(y)-dt.timedelta(days=2),   # Good Friday
              last_mon(5),              # Memorial — last Mon May
              obs(dt.date(y,6,19)),     # Juneteenth
              obs(dt.date(y,7,4)),      # Independence Day
              nth(9,0,1),               # Labor — 1st Mon Sep
              nth(11,3,4),              # Thanksgiving — 4th Thu Nov
              obs(dt.date(y,12,25)),    # Christmas
          }
          # New Year's Day: observed Mon if it lands on Sun; NYSE does NOT close
          # the preceding Fri when Jan 1 falls on Sat.
          nyd=dt.date(y,1,1)
          if nyd.weekday()==6: hols.add(nyd+dt.timedelta(days=1))
          elif nyd.weekday()<5: hols.add(nyd)

          is_open = today.weekday()<5 and today not in hols
          print(f"{today}: open={is_open} "
                f"(weekday={today.weekday()<5}, holiday={today in hols})")
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"open={'true' if is_open else 'false'}\n")
          PY

  analyze:
    needs: gate
    if: needs.gate.outputs.open == 'true'
    runs-on: ubuntu-latest
    # A stale session used to leave robin_stocks polling for a device
    # approval for ~25 min before Robinhood rate-limited it. The code now
    # fails fast instead, but cap the job as a backstop.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Robinhood session cache
        uses: actions/cache@v4
        with:
          path: ~/.tokens
          key: robinhood-session-${{ github.run_id }}
          restore-keys: robinhood-session-

      # .cache holds instrument-URL -> ticker mappings (never change) and
      # SEC insider-scan results (12h TTL) — carrying them across runs skips
      # hundreds of rate-gated SEC requests. run_id keying means each run
      # saves a fresh copy; restore-keys picks up the most recent previous one.
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: analyzer-cache-${{ github.run_id }}
          restore-keys: analyzer-cache-

      # recs_history.json is the Missed-Opportunities ledger (first-recommendation
      # dates/prices + latest prices). It holds real allocations, so it's NOT
      # committed to this public repo — it rides the Actions cache instead. Same
      # run_id + restore-keys pattern: each run saves a fresh copy and restores
      # the most recent previous one, so history accumulates across runs.
      - name: Restore recommendation history
        uses: actions/cache@v4
        with:
          path: recs_history.json
          key: recs-history-${{ github.run_id }}
          restore-keys: recs-history-

      - name: Run portfolio analyzer
        env:
          PYTHONUNBUFFERED:   "1"   # stream logs live (a silent 20-min hang was just buffering)
          RH_USERNAME:        ${{ secrets.RH_USERNAME }}
          RH_PASSWORD:        ${{ secrets.RH_PASSWORD }}
          RH_MFA_SECRET:      ${{ secrets.RH_MFA_SECRET }}   # authenticator-app TOTP secret → fully automatic login
          RH_SESSION_B64:     ${{ secrets.RH_SESSION_B64 }}
          RH_DEVICE_APPROVAL: ${{ inputs.device_approval }}
          # Lets the run write its rotated session back to the RH_SESSION_B64
          # secret. The Actions cache alone isn't durable — GitHub evicts
          # entries after 7 days without a read — so the secret is what keeps
          # the session alive across long gaps between manual dispatches.
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}   # enables news-sentiment scoring (optional)
          NEWS_MODEL:         ${{ vars.NEWS_MODEL }}              # optional override; defaults to claude-haiku-4-5 (cheapest fit)
          MISSED_OPP_MODEL:   ${{ vars.MISSED_OPP_MODEL }}        # optional; missed-opp post-mortem model, defaults to claude-opus-5 (set to a model your key can use)
          NEWS_CACHE_TTL_HOURS: ${{ vars.NEWS_CACHE_TTL_HOURS }}  # optional; unset = refresh once/calendar-day. A number = rolling N-hour window; 0 = no cache
          NEWS_BATCH_WAIT_SECONDS: ${{ vars.NEWS_BATCH_WAIT_SECONDS }}  # optional; defaults to 300s before falling back to lexicon
          # NEWS_BATCH: '0'                                       # set to disable the 50%-off Batches API pre-pass
          TAX_FILING_STATUS:  ${{ secrets.TAX_FILING_STATUS }}
          TAX_TAXABLE_INCOME: ${{ secrets.TAX_TAXABLE_INCOME }}
          TAX_STATE_RATE:     ${{ secrets.TAX_STATE_RATE }}
          TAX_APPLY_NIIT:     ${{ secrets.TAX_APPLY_NIIT }}
          SEC_USER_AGENT:     ${{ secrets.SEC_USER_AGENT }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: |
          # --tax / --analyze-misses only when their dispatch checkboxes are set.
          TAX_FLAG=""
          if [ "${{ inputs.include_tax }}" = "true" ]; then TAX_FLAG="--tax"; fi
          MISS_FLAG=""
          if [ "${{ inputs.analyze_misses }}" = "true" ]; then MISS_FLAG="--analyze-misses"; fi
          python analyze_portfolio.py \
            --source robinhood \
            --include-watchlists \
            --prune-watchlists \
            $TAX_FLAG \
            $MISS_FLAG \
            --save-positions positions.csv \
            --out report.html

      - name: Build site
        run: |
          mkdir -p _site
          cp report.html _site/index.html

      - name: Add password protection        # ← MOVED before upload
        run: python add_password_protection.py _site/index.html --in-place

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:                             # ← ADDED explicit permissions
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
